[project]
name = "todo-planner-mcp"
version = "0.1.0"
description = "MCP server exposing Microsoft To Do and Planner over Microsoft Graph (delegated auth)"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.2.0,<2",
  "msal>=1.28.0",
  "httpx>=0.27.0",
]

[project.scripts]
todo-planner-mcp = "todo_planner_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/todo_planner_mcp"]
